<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>开通会员</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="preview" aria-label="开通会员页面预览">
      <section class="phone-frame">
        <img
          class="page-image"
          src="./assets/page-base.png"
          alt="开通会员页面"
          draggable="false"
        />

        <div class="vip-motion">
          <img
            class="motion-star motion-star-top"
            src="./assets/star.png"
            alt=""
            aria-hidden="true"
            draggable="false"
          />

          <img
            class="motion-star motion-star-bottom"
            src="./assets/star.png"
            alt=""
            aria-hidden="true"
            draggable="false"
          />

          <video
            class="vip-animation"
            src="./assets/vip-animation.webm"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            aria-label="VIP 动画"
          ></video>
        </div>

        <img
          class="privileges-card"
          src="./assets/privileges.png"
          alt="尊享特权"
          draggable="false"
        />
      </section>
    </main>
  </body>
</html>
