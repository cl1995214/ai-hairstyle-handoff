<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI 换发型交互预览</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="preview" aria-label="AI 换发型交互预览">
      <section class="phone-frame" data-screen="home">
        <article class="screen screen-home" aria-label="首页">
          <img
            class="page-image"
            src="./assets/home.jpg"
            alt="首页"
            draggable="false"
          />
          <button class="hotspot hotspot-upload" type="button" data-target="result" aria-label="上传正面照片"></button>
          <img class="tap-hint tap-hint-upload" src="./assets/tap-hint.png" alt="" aria-hidden="true" draggable="false" />
        </article>

        <article class="screen screen-result" aria-label="结果页">
          <img
            class="page-image"
            data-src="./assets/result.jpg"
            alt="结果页"
            draggable="false"
          />
          <button class="hotspot hotspot-back" type="button" data-target="home" aria-label="返回首页"></button>
          <button class="hotspot hotspot-result-primary" type="button" data-target="member" aria-label="进入开通会员页"></button>
          <button class="hotspot hotspot-result-download" type="button" data-target="member" aria-label="下载"></button>
          <button class="hotspot hotspot-result-retry" type="button" data-target="member" aria-label="再试一个"></button>
          <button class="hotspot hotspot-result-color" type="button" data-target="member" aria-label="发色"></button>
          <img class="tap-hint tap-hint-result" src="./assets/tap-hint.png" alt="" aria-hidden="true" draggable="false" />
          <img class="tap-hint tap-hint-result-color" src="./assets/tap-hint.png" alt="" aria-hidden="true" draggable="false" />
        </article>

        <article class="screen screen-member" aria-label="开通会员页">
        <img
          class="page-image"
          data-src="./assets/page-base.jpg"
          alt="开通会员页面"
          draggable="false"
        />
        <button class="hotspot hotspot-back" type="button" data-target="result" aria-label="返回结果页"></button>

        <div class="vip-motion">
          <img
            class="motion-star motion-star-top"
            data-src="./assets/star.png"
            alt=""
            aria-hidden="true"
            draggable="false"
          />

          <img
            class="motion-star motion-star-bottom"
            data-src="./assets/star.png"
            alt=""
            aria-hidden="true"
            draggable="false"
          />

          <video
            class="vip-animation"
            data-src="./assets/vip-animation.webm"
            autoplay
            muted
            loop
            playsinline
            preload="none"
            aria-label="VIP 动画"
          ></video>

          <canvas class="vip-canvas" aria-hidden="true"></canvas>
        </div>

        <img
          class="privileges-card"
          data-src="./assets/privileges.png"
          alt="尊享特权"
          draggable="false"
        />
        <button class="hotspot hotspot-member-submit" type="button" aria-label="立即订阅"></button>
        <img class="tap-hint tap-hint-member" src="./assets/tap-hint.png" alt="" aria-hidden="true" draggable="false" />
        </article>
      </section>
    </main>

    <script>
      const frame = document.querySelector(".phone-frame");
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (isIOS) {
        document.documentElement.classList.add("is-ios");
      }

      let iosCanvasStarted = false;

      const drawCover = (context, video, width, height) => {
        const scale = Math.max(width / video.videoWidth, height / video.videoHeight);
        const drawWidth = video.videoWidth * scale;
        const drawHeight = video.videoHeight * scale;
        context.drawImage(video, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
      };

      const removeEdgeBlack = (imageData) => {
        const { data, width, height } = imageData;
        const total = width * height;
        const seen = new Uint8Array(total);
        const queue = new Int32Array(total);
        let head = 0;
        let tail = 0;

        const isBackground = (index) => {
          const offset = index * 4;
          return data[offset] < 42 && data[offset + 1] < 42 && data[offset + 2] < 42;
        };

        const add = (index) => {
          if (!seen[index] && isBackground(index)) {
            seen[index] = 1;
            queue[tail] = index;
            tail += 1;
          }
        };

        for (let x = 0; x < width; x += 1) {
          add(x);
          add((height - 1) * width + x);
        }

        for (let y = 0; y < height; y += 1) {
          add(y * width);
          add(y * width + width - 1);
        }

        while (head < tail) {
          const index = queue[head];
          head += 1;
          const x = index % width;
          const y = Math.floor(index / width);
          if (x > 0) add(index - 1);
          if (x < width - 1) add(index + 1);
          if (y > 0) add(index - width);
          if (y < height - 1) add(index + width);
        }

        for (let i = 0; i < tail; i += 1) {
          data[queue[i] * 4 + 3] = 0;
        }

        return imageData;
      };

      const startIOSCanvasVideo = () => {
        if (!isIOS || iosCanvasStarted) return;

        const video = document.querySelector(".vip-animation");
        const canvas = document.querySelector(".vip-canvas");
        if (!video || !canvas || !video.getAttribute("src")) return;

        iosCanvasStarted = true;

        const width = 360;
        const height = 314;
        const workCanvas = document.createElement("canvas");
        const workContext = workCanvas.getContext("2d", { willReadFrequently: true });
        const displayContext = canvas.getContext("2d");
        workCanvas.width = width;
        workCanvas.height = height;
        canvas.width = width;
        canvas.height = height;
        let lastFrameTime = 0;

        const render = (timestamp) => {
          if (!canvas.isConnected) return;
          if (timestamp - lastFrameTime >= 42 && !video.paused && !video.ended && video.videoWidth && video.videoHeight) {
            lastFrameTime = timestamp;
            workContext.clearRect(0, 0, width, height);
            drawCover(workContext, video, width, height);
            const frame = removeEdgeBlack(workContext.getImageData(0, 0, width, height));
            displayContext.putImageData(frame, 0, 0);
          }
          requestAnimationFrame(render);
        };

        const playAndRender = () => {
          video.play().catch(() => {});
          requestAnimationFrame(render);
        };

        if (video.readyState >= 2) {
          playAndRender();
        } else {
          video.addEventListener("loadeddata", playAndRender, { once: true });
        }
      };

      const loadScreenAssets = (screenName) => {
        document
          .querySelectorAll(`.screen-${screenName} [data-src]`)
          .forEach((asset) => {
            if (!asset.getAttribute("src")) {
              asset.setAttribute("src", asset.dataset.src);
            }
          });

        if (screenName === "member") {
          startIOSCanvasVideo();
        }
      };

      document.querySelectorAll("[data-target]").forEach((control) => {
        control.addEventListener("click", () => {
          const target = control.dataset.target;
          loadScreenAssets(target);
          frame.dataset.screen = target;
        });
      });
    </script>
  </body>
</html>
